name: window_paint
description: A powerful, extensible drawing widget for Flutter. v2.0 features clean architecture, 
  type safety, and enhanced extensibility. Perfect for PDF annotations, markup tools, and drawing apps.
version: 2.0.0
homepage: https://github.com/graknol/window_paint
repository: https://github.com/graknol/window_paint
issue_tracker: https://github.com/graknol/window_paint/issues

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  measurer: ^2.1.1
  uuid: ^4.5.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
